<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="1040" height="600">
  <style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&amp;family=Manrope:wght@800&amp;display=block');</style>
    <defs>
      <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF3B5"/><stop offset=".28" stop-color="#F3CE63"/><stop offset=".52" stop-color="#C38F25"/>
        <stop offset=".7" stop-color="#F6D778"/><stop offset="1" stop-color="#8C5F12"/>
      </linearGradient>
      <linearGradient id="prata" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E9E6DF"/><stop offset="1" stop-color="#BDB8AD"/>
      </linearGradient>
      <filter id="relevo" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".7"/>
      </filter>
    </defs>
    <!-- Coroa de 5 pontas, como no logo -->
    <symbol id="coroa" viewBox="0 -14 200 112">
      <g fill="url(#ouro)" stroke="#5A3D07" stroke-width="1.4" stroke-linejoin="round">
        <path d="M42 76 L14 22 L20 21 L58 56 L68 24 L86 52 L100 2 L114 52 L132 24 L142 56 L180 21 L186 22 L158 76 Q100 68 42 76 Z"/>
        <path d="M42 77 Q100 69 158 77 L154 93 Q100 86 46 93 Z"/>
        <circle cx="68" cy="18" r="5.5"/><circle cx="132" cy="18" r="5.5"/>
        <path d="M100 -12 L105.5 -3 L100 4 L94.5 -3 Z"/>
        <circle cx="12" cy="19" r="4"/><circle cx="188" cy="19" r="4"/>
      </g>
      <g fill="#5A3D07" opacity=".85">
        <circle cx="60" cy="84" r="2.6"/><circle cx="80" cy="82.5" r="2.6"/><circle cx="120" cy="82.5" r="2.6"/><circle cx="140" cy="84" r="2.6"/>
        <path d="M100 76.5 L105 82 L100 87.5 L95 82 Z"/>
        <circle cx="76" cy="66" r="1.8"/><circle cx="88" cy="65" r="1.8"/><circle cx="100" cy="64.5" r="1.8"/><circle cx="112" cy="65" r="1.8"/><circle cx="124" cy="66" r="1.8"/>
      </g>
      <g fill="none" stroke="#FFF6C8" stroke-width="1" opacity=".55">
        <path d="M100 8 L100 60"/><path d="M68 28 L72 60"/><path d="M132 28 L128 60"/>
      </g>
    </symbol>
    <!-- Logo completo: coroa + KING + EVENTOS -->
    <g id="logo-arte">
      <use href="#coroa" x="178" y="0" width="164" height="92"/>
      <text x="260" y="222" text-anchor="middle" textLength="476" lengthAdjust="spacingAndGlyphs"
            font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-weight="900" font-size="140"
            fill="url(#ouro)" stroke="#5A3D07" stroke-width="1.6" paint-order="stroke" filter="url(#relevo)">KING</text>
      <rect x="24" y="258" width="128" height="3.5" rx="1.5" fill="url(#ouro)"/>
      <rect x="368" y="258" width="128" height="3.5" rx="1.5" fill="url(#ouro)"/>
      <text x="260" y="272" text-anchor="middle" textLength="190" lengthAdjust="spacingAndGlyphs"
            font-family="Manrope, 'Segoe UI', sans-serif" font-weight="800" font-size="36" fill="url(#prata)">EVENTOS</text>
    </g>
  <use href="#logo-arte" style="display:none"/>
</svg>
